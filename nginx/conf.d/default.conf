# HTTP -> HTTPS redirect + ACME challenge passthrough
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS termination + reverse proxy to the ingestion API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # Replace with your real domain before running certbot.
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Google push notifications arrive here (silent body; all data in headers)
    location /webhooks/google/calendar {
        proxy_pass http://app-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Explicitly forward Google's notification headers
        proxy_set_header X-Goog-Channel-ID     $http_x_goog_channel_id;
        proxy_set_header X-Goog-Resource-ID    $http_x_goog_resource_id;
        proxy_set_header X-Goog-Resource-State $http_x_goog_resource_state;
        proxy_set_header X-Goog-Resource-URI   $http_x_goog_resource_uri;
        proxy_set_header X-Goog-Channel-Token  $http_x_goog_channel_token;
        proxy_set_header X-Goog-Message-Number $http_x_goog_message_number;
        proxy_set_header X-Goog-Changed        $http_x_goog_changed;

        proxy_connect_timeout 5s;
        proxy_read_timeout    5s;
        proxy_send_timeout    5s;
    }

    location /healthz { proxy_pass http://app-api:3000; }
    location /readyz  { proxy_pass http://app-api:3000; }
}
