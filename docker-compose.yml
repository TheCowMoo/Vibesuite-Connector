services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-api:
    build: ./app
    env_file: .env
    command: ["node", "dist/api/server.js"]
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  app-worker:
    build: ./app
    env_file: .env
    command: ["node", "dist/workers/syncWorker.js"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app-api
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot
    restart: unless-stopped

volumes:
  redis-data:
